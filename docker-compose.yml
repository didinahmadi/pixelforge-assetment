services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
        depends_on:
            - node

    nginx:
        image: nginx:stable-alpine
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    node:
        build:
            context: .
            dockerfile: docker/node/Dockerfile
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        ports:
            - "${VITE_PORT:-5173}:5173"

volumes:
    node_modules:
